[project]
name = "hr-analytics"
version = "1.1.0"
description = "AI-Powered Employee Attrition Intelligence System with SHAP explainability, fairness auditing, causal inference, adversarial robustness, and real-time risk scoring."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dice-ml>=0.11",
    "evidently<=0.4.34",
    "fairlearn>=0.13.0",
    "fastapi>=0.136.0",
    "google-genai>=1.73.1",
    "matplotlib>=3.10.8",
    "mlflow-skinny>=2.21.0",
    "numpy>=2.4.4",
    "optuna>=4.8.0",
    "pandas>=3.0.2",
    "pytest>=9.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.46.0",
    "xgboost>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "adversarial-robustness-toolbox>=1.18.0",
    "dowhy>=0.11.1",
    "lifelines>=0.30.0",
    "scipy>=1.14.0",
    "joblib>=1.4.0",
    "imbalanced-learn>=0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=tests/load_test.py"
