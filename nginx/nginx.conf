# ── Nginx TLS Reverse Proxy Configuration ──────────────────────────────
# Production configuration for the HR Attrition Intelligence System.
#
# Purpose:
#   - TLS termination (HTTPS) for all client traffic
#   - Reverse proxy to FastAPI backend and React frontend
#   - Additional security headers (HSTS, CSP)
#   - Request size limits to prevent abuse
#   - Rate limiting to prevent brute-force and DoS attacks
#
# Certificate Setup:
#   For development, generate self-signed certs:
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout nginx/certs/selfsigned.key \
#       -out nginx/certs/selfsigned.crt \
#       -subj "/CN=localhost"
#
#   For production, use Let's Encrypt via certbot or your org's CA.

# ── Rate Limiting Zones ───────────────────────────────────────────────
# Zone: general API requests — 10 req/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Zone: auth endpoints (login, whoami) — 3 req/s per IP to prevent brute-force
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=3r/s;

# Zone: system/admin endpoints — 1 req/s per IP (most restrictive)
limit_req_zone $binary_remote_addr zone=api_system:10m rate=1r/s;

# Zone: prediction endpoint — 5 req/s per IP
limit_req_zone $binary_remote_addr zone=api_predict:10m rate=5r/s;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS Configuration ──────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Request Limits ─────────────────────────────────────────────
    client_max_body_size 1m;    # Prevent large payload abuse
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Rate Limit Error Response ──────────────────────────────────
    limit_req_status 429;

    # ── Auth Endpoints (brute-force protection) ────────────────────
    location /v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ── System/Admin Endpoints (most restrictive) ──────────────────
    location /v1/system/ {
        limit_req zone=api_system burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── GDPR Endpoints (restrictive) ──────────────────────────────
    location /v1/gdpr/ {
        limit_req zone=api_system burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ── Prediction Endpoint ────────────────────────────────────────
    location /v1/predict {
        limit_req zone=api_predict burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── General API Backend ────────────────────────────────────────
    location /v1/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Swagger Docs (restrict to internal IPs in production) ──────
    location /docs {
        # Allow internal/VPN access only — uncomment in production:
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── React Frontend (default) ───────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
